use_wandb: False
use_sky: False
use_dynamic: False
use_refine: False

mode: 'vio'

device:
  tracker: 'cuda:0'
  mapper: 'cuda:0'

dataset:
  root: /autodl-fs/data/slamdata/VINGS-Mono/dataset/KITTI360_Unsync/2013_05_28/2013_05_28_drive_0010_sync/
  module: datasets.kitti360_unsync
  rgb_strip: 1

middleware:
  cov_times: 1000
  max_cov: 2e4
  max_depth: 30

output:
  save_dir: /root/autodl-tmp/VINGS-Mono/output/

intrinsic:
  H: 512
  W: 1392
  fu: 786.382230
  fv: 788.629315
  cu: 317.752196
  cv: 687.158398
  bg: 0
  distortion_coeffs: [-0.344441, 0.141678, 0.000414, -0.000222, -0.029608]

frontend:
  weight: /root/autodl-tmp/VINGS-Mono/ckpts/droid.pth
  image_size: [264, 728]
  buffer: 80
  filter_thresh: 2.4
  c2i: None
  visual_only: 0
  warm_up: 8
  beta: 0.3
  frontend_nms: 1
  keyframe_thresh: 4.0
  frontend_window: 5
  frontend_thresh: 16.0
  frontend_radius: 2
  active_window: 12
  max_factors: 48
  far_threshold: 0.02
  inac_range: 3
  mask_threshold: -1.0
  skip_edge: [-4, -5, -6]
  translation_threshold: 0.5
  show_plot: False

adc_args:
  accum_thresh: 0.98

training_args:
  num_keyframe: 4
  iters: 30
  max_new_gaussians_per_frame: 25000
  lr:
    _xyz_lr: 0.00002
    _rgb_lr: 0.0025
    _opacity_lr: 0.05
    _scaling_lr: 0.001
    _rotation_lr: 0.001
    _c2c_lr: 0.0001
  loss_weights:
    rgb_loss: 1.0
    depth_loss: 1.0
    alpha_loss: 0.0
    normal_loss: 0.01
    dist_loss: 0.0

use_vis: False

use_metric: False

use_storage_manager: True
storage_manager:
  distance_threshold: 40.0
  run_interval: 5
