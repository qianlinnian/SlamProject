# mobile_vo.yaml - phone real-time WebSocket capture + server-side VO mapping
# startup:
#   python scripts/run_multiprocess_mobile.py configs/mobile/mobile_vo.yaml

use_wandb: False
use_sky: False
use_dynamic: False
use_loop: False
use_pose_refine: False
use_metric: False
use_mobile: True

# Keep mobile real-time mode fixed to VO for now.
# IMU is still transmitted, but current mobile IMU data is not stable enough for VIO.
mode: 'vo'

device:
  tracker: 'cuda:0'
  mapper: 'cuda:0'

dataset:
  root: ./mobile_data
  module: datasets.phone_server

middleware:
  cov_times: 100
  max_cov: 1e4
  max_depth: 10

output:
  save_dir: ./output/

intrinsic:
  H: 240
  W: 320
  fu: 247.54
  fv: 247.34
  cu: 159.42
  cv: 118.15
  resolution_scale: 1.0
  bg: 0

frontend:
  weight: ckpts/droid.pth
  image_size: [256, 448]
  buffer: 80
  filter_thresh: 2.4
  c2i: None
  warm_up: 8
  beta: 0.3
  frontend_nms: 1
  keyframe_thresh: 4.0
  frontend_window: 5
  frontend_thresh: 4.0
  frontend_radius: 2
  active_window: 12
  max_factors: 48
  far_threshold: 0.02
  inac_range: 3
  mask_threshold: -1.0
  skip_edge: [-4, -5, -6]
  translation_threshold: 0.3
  show_plot: False

adc_args:
  accum_thresh: 0.98

training_args:
  num_keyframe: 8
  iters: 8
  lr:
    _xyz_lr: 0.00002
    _rgb_lr: 0.0001
    _opacity_lr: 0.02
    _scaling_lr: 0.001
    _rotation_lr: 0.001
  loss_weights:
    rgb_loss: 1.0
    depth_loss: 1.0
    alpha_loss: 0.5
    normal_loss: 0.05
    dist_loss: 0.0
    smooth_loss: 0.0
  max_new_gaussians_per_frame: 3000

use_storage_manager: True
storage_manager:
  distance_threshold: 30.0
  run_interval: 3
  max_gpu_gaussians: 600000

use_vis: True
vis:
  bev_w2c: [[ 4.05583909e-02,  4.81508139e-01, -8.75502672e-01, -5.30837468e-02],
            [-9.96537512e-01,  8.31432172e-02, -4.38402075e-04, 2.36458792e-01],
            [ 7.25810147e-02,  8.72489036e-01,  4.83213078e-01, 15.60963384e+00],
            [ 0.00000000e+00,  0.00000000e+00,  0.00000000e+00, 1.00000000e+00]]
  bev_intrinsic_dict:
    H: 758
    W: 1372
    fu: 656.44725606860459
    fv: 656.44725606860459
    cu: 378.5
    cv: 685.5
  pose_scale: 0.18
